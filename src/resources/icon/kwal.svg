<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs id="defs6">
        <style id="current-color-scheme" type="text/css">
        .ColorScheme-Text { color:#fcfcfc; }
        .ColorScheme-Background { color:#232629; }
        </style>
        <!--Gradiente dinámico para el cuerpo principal-->
        <linearGradient id="main_grad" x1="74.08438" y1="9.9654818" x2="470.33092" y2="406.21202" gradientTransform="scale(0.9490935,1.053637)" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="currentColor" class="ColorScheme-Text" id="stop1"/>
            <stop offset="100%" stop-color="currentColor" class="ColorScheme-Text" stop-opacity="1" id="stop2"/>
        </linearGradient>
        <!--Biselado dinámico-->
        <linearGradient id="bevel_grad" x1="69.797594" y1="6.1754925" x2="69.797594" y2="410.43273" gradientTransform="scale(0.95007577,1.0525476)" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="white" stop-opacity="0.5" id="stop3"/>
            <stop offset="100%" stop-color="black" stop-opacity="0.2" id="stop4"/>
        </linearGradient>
        <!--Sombra interna-->
        <filter id="inner-shadow" x="-0.061689821" y="-0.055568862" width="1.1233796" height="1.1159281">
            <feOffset dx="0" dy="2" id="feOffset4"/>
            <feGaussianBlur stdDeviation="3" result="offset-blur" id="feGaussianBlur4"/>
            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" id="feComposite4"/>
            <feFlood flood-color="black" flood-opacity="0.2" result="color" id="feFlood4"/>
            <feComposite operator="in" in="color" in2="inverse" result="shadow" id="feComposite5"/>
            <feComposite operator="over" in="shadow" in2="SourceGraphic" id="feComposite6"/>
        </filter>
    </defs>
    <!--Capas de fondo dinámicas con opacidad-->
    <rect id="left_rect" x="14.5" y="46.688" width="404.28" height="448.813" rx="48" ry="48" fill="currentColor" class="ColorScheme-Text" opacity="0.4"/>
    <rect id="right_rect" x="399.78" y="47.25" width="98.72" height="318.344" rx="48" ry="48" fill="currentColor" class="ColorScheme-Text" opacity="0.7"/>
    <!--Bloque Central-->
    <g filter="url(#inner-shadow)" id="g6" transform="translate(0,28)">
        <rect id="central_rect_bg" x="70.313004" y="10.5" width="376.07501" height="417.5" rx="48" ry="48" fill="currentColor" stroke="currentColor" stroke-width="32" class="ColorScheme-Background"/>
        <rect id="central_rect" x="70.313004" y="10.5" width="376.07501" height="417.5" rx="48" ry="48" fill="url(#main_grad)" class="ColorScheme-Text" style="fill:url(#main_grad)"/>
        <!--Bisel-->
        <rect x="70.313004" y="10.5" width="376.07501" height="417.5" rx="48" ry="48" fill="none" stroke="url(#bevel_grad)" stroke-width="16" opacity="0.4" id="rect6" style="stroke:url(#bevel_grad)"/>
    </g>
    <!--Letra K (Usa el color de fondo del tema para contraste)-->
    <path id="central_k" d="m 145.528,122 h 65.813 v 83.5 L 305.36,122 h 75.215 L 258.35,236.813 380.575,372.5 H 305.36 L 211.341,278.563 V 372.5 h -65.813 z" fill="currentColor" opacity="0.6" class="ColorScheme-Background"/>
    <!--Brillo sutil-->
    <ellipse cx="258" cy="68" rx="150" ry="20" fill="#ffffff" opacity="0.10" id="ellipse6"/>
</svg>
