    <style
       id="current-color-scheme"
       type="text/css">
      /* Colores Principales y de Texto */
      .ColorScheme-Text { color: #d9d1b3; } <!-- d9d1b3 -->
      .ColorScheme-Background { color: #0a1428; } <!-- 0a1428 -->
      .ColorScheme-BackgroundAlternate { color: #265178; }
      .ColorScheme-Highlight { color: #5a4d6d; } <!-- 5a4d6d -->
      .ColorScheme-InactiveText { color: #8d8e91; } <!-- 8d8e91 -->
      
      /* Variantes de Vista (Listas, tablas, campos de texto) */
      .ColorScheme-ViewText { color: #232629; }
      .ColorScheme-ViewBackground { color: #fcfcfc; }
      .ColorScheme-ViewHover { color: #93ceed; }
      .ColorScheme-ViewFocus { color: #3daee9; }

      /* Variantes de Botones */
      .ColorScheme-ButtonText { color: #232629; }
      .ColorScheme-ButtonBackground { color: #eff0f1; }
      .ColorScheme-ButtonHover { color: #93ceed; }
      .ColorScheme-ButtonFocus { color: #3daee9; }

      /* Estados de Alerta, Semánticos y Notificaciones */
      .ColorScheme-NegativeText { color: #da4453; }
      .ColorScheme-NeutralText { color: #f67400; }
      .ColorScheme-PositiveText { color: #27ae60; }

      /* Textos Secundarios y Auxiliares */
      .ColorScheme-LinkText { color: #2980b9; }
      .ColorScheme-VisitedText { color: #678cb2; }
      
      /* Elementos Decorativos y de Ventana */
      .ColorScheme-WindowText { color: #232629; }
      .ColorScheme-WindowBackground { color: #eff0f1; }
      .ColorScheme-HeaderText { color: #232629; }
      .ColorScheme-HeaderBackground { color: #fcfcfc; }
    </style>
