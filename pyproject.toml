[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]

name = "kwal"

version = "0.1"
requires-python = ">=3.10"
authors = [
    {name = "iguruspain", email = "iguruspain@example.com"}
]
description = "Kwal — a small Kirigami-based wallpaper manager (PySide6 + QML)."
readme = "README.md"
license = { file = "LICENSE.txt" }
keywords = ["kirigami", "kwin", "wallpaper", "qml", "pyside6"]
urls = { "Homepage" = "https://github.com/iguruspain/kwal", "Repository" = "https://github.com/iguruspain/kwal" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
    "Programming Language :: Python",
    "Operating System :: POSIX :: Linux",
]

# Python-only dependencies (installed via pip).
# System dependencies (PySide6, Qt6 WebEngine, Kirigami) must be installed
# via the distribution's package manager. See README.md for details.
dependencies = [
    "json5",
    "materialyoucolor",
    "modern_colorthief",
    "Pillow",
    "pywal16",
    "tomlkit",
]

[project.scripts]

kwal = "kwal.app:main"


[tool.setuptools]
packages = ["kwal", "kwal.controllers", "kwal.models", "kwal.providers", "kwal.utils"]
package-dir = {kwal = "src", "kwal.controllers" = "src/controllers", "kwal.models" = "src/models", "kwal.providers" = "src/providers", "kwal.utils" = "src/utils"}



include-package-data = true

[tool.setuptools.data-files]
"share/applications" = ["org.kde.kwal.desktop"]
"share/icons/hicolor/scalable/apps" = ["src/resources/icon/kwal.svg"]

[tool.setuptools.package-data]
kwal = ["resources/templates/**/*", "resources/icon/*.svg", "qml/**/*.qml"]


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []
